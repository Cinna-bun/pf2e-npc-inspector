name: Release Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure module.json for release
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          MANIFEST="https://github.com/${REPO}/releases/latest/download/module.json"
          DOWNLOAD="https://github.com/${REPO}/releases/download/${TAG}/module.zip"
          URL="https://github.com/${REPO}"

          jq \
            --arg version "$VERSION" \
            --arg manifest "$MANIFEST" \
            --arg download "$DOWNLOAD" \
            --arg url "$URL" \
            '.version = $version | .manifest = $manifest | .download = $download | .url = $url' \
            module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Create module archive
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            LICENSE \
            scripts/ \
            styles/ \
            templates/ \
            languages/

      - name: Upload release assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: module.json,module.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
